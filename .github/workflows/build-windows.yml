name: Gerar instalador Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["supabase/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      # Cada build ganha um número de versão maior (0.1.<número do build>),
      # assim o app instalado sabe que existe atualização.
      - name: Definir versão
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $v = "${{ github.ref_name }}".TrimStart("v")
            $tag = "${{ github.ref_name }}"
          } else {
            $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
            $parts = $conf.version.Split(".")
            $v = "$($parts[0]).$($parts[1]).${{ github.run_number }}"
            $tag = "beta-${{ github.run_number }}"
          }
          node -e "const f='src-tauri/tauri.conf.json';const fs=require('fs');const c=JSON.parse(fs.readFileSync(f));c.version='$v';fs.writeFileSync(f,JSON.stringify(c,null,2));"
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Versão $v"

      - name: Baixar FFmpeg (empacotado junto com o app)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $bin = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item $bin.FullName src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe
          Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg-tmp

      - name: Instalar dependências
        run: npm ci

      - name: Baixar modelo de detecção de rosto
        run: npm run assets

      # O endereço do servidor e a chave pública ficam em app/.env.production
      - name: Compilar o app
        shell: pwsh
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npx tauri build
          } else {
            Write-Host "::warning::Sem a chave de assinatura: esta versão não terá atualização automática."
            '{"bundle":{"createUpdaterArtifacts":false}}' | Out-File -Encoding ascii no-updater.json
            npx tauri build --config no-updater.json
          }

      - name: Preparar arquivos do release
        shell: pwsh
        run: |
          $notes = (git log -1 --pretty=%B) -join "`n"
          node scripts/make-release.mjs "${{ steps.ver.outputs.version }}" "${{ github.repository }}" "${{ steps.ver.outputs.tag }}" "$notes"

      - name: Guardar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: Clipei-Cut-instalador-windows
          path: app/release/*
          if-no-files-found: error

      - name: Publicar versão para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Clipei Cut ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          body: |
            Instalador do Clipei Cut ${{ steps.ver.outputs.version }} para Windows. Baixe o arquivo `.exe` abaixo e execute.
            Se o Windows avisar "app desconhecido", clique em "Mais informações" e depois em "Executar assim mesmo".
            Quem já tem o app instalado recebe esta versão automaticamente.
          files: app/release/*
