name: Gerar instalador Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["supabase/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Baixar FFmpeg (empacotado junto com o app)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $bin = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item $bin.FullName src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe
          Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg-tmp

      - name: Instalar dependências
        run: npm ci

      - name: Baixar modelo de detecção de rosto
        run: npm run assets

      # O endereço do servidor e a chave pública ficam em app/.env.production
      - name: Compilar o app
        run: npx tauri build

      - name: Guardar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: Clipei-Cut-instalador-windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publicar versão para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('beta-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Clipei Cut {0}', github.ref_name) || format('Clipei Cut beta (build {0})', github.run_number) }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: true
          body: |
            Instalador do Clipei Cut para Windows. Baixe o arquivo `.exe` abaixo e execute.
            Se o Windows avisar "app desconhecido", clique em "Mais informações" e depois em "Executar assim mesmo".
          files: app/src-tauri/target/release/bundle/nsis/*.exe
