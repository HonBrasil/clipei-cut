name: Publicar servidor (funções Supabase)

# Publica o código das funções e aplica as mudanças novas do banco.
# Não mexe nas chaves secretas (essas ficam no painel do Supabase).
# Segredos no GitHub: SUPABASE_ACCESS_TOKEN (obrigatório) e SUPABASE_DB_PASSWORD (para o banco).
on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: cnnouuyaduqwdrhkxpkx
    steps:
      - uses: actions/checkout@v4

      - name: Verificar token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN no GitHub (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Atualizar o banco de dados
        if: env.SUPABASE_DB_PASSWORD != ''
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          # As duas primeiras migrações já foram aplicadas direto no painel
          supabase migration repair --status applied 20261120000000 20261120200000 --password "$SUPABASE_DB_PASSWORD" || true
          supabase db push --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Aviso sobre o banco
        if: env.SUPABASE_DB_PASSWORD == ''
        run: echo "::warning::Sem SUPABASE_DB_PASSWORD - as mudanças do banco não foram aplicadas."

      # Publica todas as pastas de supabase/functions; a verificação de login
      # de cada função vem do supabase/config.toml (mp-webhook fica aberta).
      - name: Publicar as funções
        run: supabase functions deploy --project-ref "$PROJECT_REF" --yes
