name: Publicar servidor (funções Supabase)

# Publica só o código das funções. Não mexe no banco nem nas chaves secretas
# (essas ficam no painel do Supabase). Precisa do segredo SUPABASE_ACCESS_TOKEN.
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/config.toml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: cnnouuyaduqwdrhkxpkx
    steps:
      - uses: actions/checkout@v4

      - name: Verificar token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN no GitHub (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar as funções
        run: |
          supabase functions deploy transcribe --project-ref "$PROJECT_REF"
          supabase functions deploy analyze --project-ref "$PROJECT_REF"
          supabase functions deploy checkout --project-ref "$PROJECT_REF"
          supabase functions deploy cancel-subscription --project-ref "$PROJECT_REF"
          supabase functions deploy post-copy --project-ref "$PROJECT_REF"
          supabase functions deploy mp-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
