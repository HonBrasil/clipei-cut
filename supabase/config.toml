# Configuração mínima do Supabase CLI para o Clipei Cut
project_id = "clipei-cut"

[functions.transcribe]
verify_jwt = true

[functions.analyze]
verify_jwt = true

[functions.checkout]
verify_jwt = true

[functions.cancel-subscription]
verify_jwt = true

# O Mercado Pago não envia token do Supabase: a função valida a assinatura do aviso
[functions.mp-webhook]
verify_jwt = false
